name: Multi-Platform Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Cross-Platform Binaries & SHA256 Checksums
        run: |
          mkdir -p dist
          TAG_NAME="${GITHUB_REF#refs/tags/}"

          PLATFORMS=(
            "linux/amd64/tfout_${TAG_NAME}_linux_amd64"
            "linux/arm64/tfout_${TAG_NAME}_linux_arm64"
            "darwin/amd64/tfout_${TAG_NAME}_darwin_amd64"
            "darwin/arm64/tfout_${TAG_NAME}_darwin_arm64"
            "windows/amd64/tfout_${TAG_NAME}_windows_amd64.exe"
            "windows/arm64/tfout_${TAG_NAME}_windows_arm64.exe"
          )

          for PLATFORM in "${PLATFORMS[@]}"; do
            GOOS=$(echo $PLATFORM | cut -d'/' -f1)
            GOARCH=$(echo $PLATFORM | cut -d'/' -f2)
            OUTFILE=$(echo $PLATFORM | cut -d'/' -f3)

            echo "Building dist/$OUTFILE ($GOOS/$GOARCH)..."
            GOOS=$GOOS GOARCH=$GOARCH CGO_ENABLED=0 go build \
              -ldflags="-s -w -X github.com/tfout/tfout/pkg/cli.Version=${TAG_NAME} -X github.com/tfout/tfout/pkg/cli.Commit=${GITHUB_SHA:0:7} -X github.com/tfout/tfout/pkg/cli.Date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
              -o "dist/$OUTFILE" ./cmd/tfout
          done

          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
